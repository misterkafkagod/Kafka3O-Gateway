# Local multi-cluster dev stack: two single-node Kafka clusters, one gateway each.
# Set KAFKA3O_TLS_CERT_FILE and KAFKA3O_TLS_KEY_FILE to certificate/key paths on
# the Docker host. The private key must be readable by the nonroot gateway user.
# Set KAFKA3O_DEV_TOKEN and KAFKA3O_PROD_TOKEN to separate strong random tokens.
# For a remote Docker daemon, the TLS file paths must exist on that remote host.
#   docker compose -f deploy/compose.dev.yaml up -d --build
name: kafka3o-dev

x-kafka-env: &kafka-env
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

x-gateway-env: &gateway-env
  KAFKA3O_HTTP__CORS__ALLOWEDORIGINS: http://localhost:5173
  KAFKA3O_HTTP__TLS__CERTIFICATEFILE: /run/kafka3o/certificate.pem
  KAFKA3O_HTTP__TLS__KEYFILE: /run/kafka3o/private-key.pem

x-gateway-tls-volumes: &gateway-tls-volumes
  - "${KAFKA3O_TLS_CERT_FILE:?Set KAFKA3O_TLS_CERT_FILE}:/run/kafka3o/certificate.pem:ro"
  - "${KAFKA3O_TLS_KEY_FILE:?Set KAFKA3O_TLS_KEY_FILE}:/run/kafka3o/private-key.pem:ro"

services:
  kafka-dev:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      CLUSTER_ID: nDF93h0CSDizRRs5DIdLeQ
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dev:9092

  kafka-prod:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      CLUSTER_ID: 2T0OZmnUTUWX6Hoz9ygeQg
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-prod:9092

  gateway-dev:
    build: ..
    image: kafka3o-gateway:dev
    environment:
      <<: *gateway-env
      KAFKA3O_KAFKA__BROKERS: kafka-dev:9092
      KAFKA3O_GATEWAY_TOKEN: ${KAFKA3O_DEV_TOKEN:?Set KAFKA3O_DEV_TOKEN}
    volumes: *gateway-tls-volumes
    ports:
      - "8081:8080"
    depends_on:
      - kafka-dev

  gateway-prod:
    image: kafka3o-gateway:dev
    environment:
      <<: *gateway-env
      KAFKA3O_KAFKA__BROKERS: kafka-prod:9092
      KAFKA3O_GATEWAY_TOKEN: ${KAFKA3O_PROD_TOKEN:?Set KAFKA3O_PROD_TOKEN}
    volumes: *gateway-tls-volumes
    ports:
      - "8082:8080"
    depends_on:
      - kafka-prod
      - gateway-dev
