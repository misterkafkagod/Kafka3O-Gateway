apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka3o-test-a
  labels:
    app.kubernetes.io/part-of: kafka3o-test-clusters
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: kafka3o-test-clusters
    name: kafka-a-data
  local:
    path: /var/lib/kafka3o-test-clusters/kafka-a
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [eksd-01]
---
