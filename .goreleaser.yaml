# Release configuration (TECH-SPEC §1.0 supply chain, §1.1 release row, §5.0 Y4).
# Run by .github/workflows/release.yml on a v* tag; locally:
#   goreleaser build --snapshot --clean
version: 2

project_name: kafka3o-gateway

builds:
  - id: kafka3o-gateway
    main: ./cmd/gateway
    binary: kafka3o-gateway
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: file timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/config.example.yaml

checksum:
  name_template: checksums.txt

# One CycloneDX and one SPDX document per archive (TECH-SPEC §1.0).
sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
  - id: spdx
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless (OIDC) signature over the checksum file, which covers every archive.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    artifacts: checksum
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

# The image is built from the repository Dockerfile (the same one `make image`
# uses), so the release and local images share one definition.
dockers_v2:
  - id: image
    dockerfile: Dockerfile
    images:
      - '{{ envOrDefault "IMAGE_REPO" "ghcr.io/misterkafkagod/kafka3o-gateway" }}'
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      VERSION: "{{ .Version }}"
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files: [go.mod, go.sum, cmd, internal]

# Keyless signature on each pushed image (dockers_v2 images are the "manifests" kind), by digest.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "${artifact}@${digest}", "--yes"]

release:
  prerelease: auto

changelog:
  use: github
  sort: asc
