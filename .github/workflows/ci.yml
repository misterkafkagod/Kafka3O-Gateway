# PR pipeline (TECH-SPEC §4.10): lint -> test (-race, coverage gate) ->
# licence scan -> fuzz 10s per target -> govulncheck -> build -> benchmarks
# published. Every stage runs through the same Makefile target a developer
# runs locally (TECH-SPEC §5.1) so this workflow never drifts from `make ci`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, test, licence, fuzz, govulncheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

      - name: Test (-race, -covermode=atomic) and coverage gate
        run: make cover

      - name: Licence scan
        run: make license

      - name: Fuzz (10s per target)
        run: make fuzz

      - name: govulncheck
        run: make govulncheck

      - name: Build
        run: make build

      - name: OpenAPI document is up to date
        run: make openapi-check

      - name: GoReleaser config is valid
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Benchmarks
        run: make benchstat-report

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchstat
          path: benchstat.txt
          if-no-files-found: error

  chart:
    name: helm lint, kubeconform, schema negative case
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/kafka3o-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: helm lint
        run: helm lint --strict "$CHART"

      - name: helm template | kubeconform -strict
        run: |
          helm template kgw "$CHART" --set bounds.maxTimeMs=10000 > rendered.yaml
          kubeconform -strict -summary rendered.yaml
          for kind in Deployment Service ServiceAccount ConfigMap Secret NetworkPolicy PodDisruptionBudget HorizontalPodAutoscaler; do
            grep -q "^kind: $kind$" rendered.yaml || { echo "missing $kind"; exit 1; }
          done

      - name: Rendered output assertions
        run: |
          helm template kgw "$CHART" --set bounds.maxTimeMs=10000 > rendered.yaml
          check() { grep -Eq -- "$1" rendered.yaml || { echo "missing: $1"; exit 1; }; }
          check '"/kafka3o-gateway", "probe", "--live"'
          check '"/kafka3o-gateway", "probe", "--ready"'
          grep -A3 'name: KGW_PROBE_API_KEY' rendered.yaml | grep -q secretKeyRef || { echo "KGW_PROBE_API_KEY not from Secret"; exit 1; }
          check 'runAsNonRoot: true'
          check 'readOnlyRootFilesystem: true'
          check 'allowPrivilegeEscalation: false'
          check 'drop: \[ALL\]'
          check 'type: RuntimeDefault'
          check 'automountServiceAccountToken: false'
          check 'terminationGracePeriodSeconds: 30'
          check 'minAvailable: 1'
          check 'port: 53'

      - name: Schema rejects a grace period shorter than maxTime + 10s
        run: |
          if helm template kgw "$CHART" --set bounds.maxTimeMs=60000 --set terminationGracePeriodSeconds=30 > /dev/null 2> err.txt; then
            echo "expected values.schema.json to reject maxTimeMs=60000 with terminationGracePeriodSeconds=30"; exit 1
          fi
          cat err.txt
          grep -q 'want 70' err.txt
          helm template kgw "$CHART" --set bounds.maxTimeMs=60000 --set terminationGracePeriodSeconds=70 > /dev/null

  image:
    name: image build, non-root check, scan gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Final stage is digest-pinned distroless
        run: |
          final=$(grep -E '^FROM ' Dockerfile | tail -1)
          echo "$final"
          echo "$final" | grep -Eq '^FROM gcr\.io/distroless/static-debian12:nonroot@sha256:[0-9a-f]{64}$'

      - name: Build image
        run: make image VERSION=ci-${{ github.sha }}

      - name: Image runs as nonroot
        run: |
          user=$(docker inspect kafka3o-gateway:ci-${{ github.sha }} --format '{{.Config.User}}')
          echo "user=$user"
          test "$user" = nonroot

      - name: Scan gate (grype, fail on high)
        uses: anchore/scan-action@v6
        with:
          image: kafka3o-gateway:ci-${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
